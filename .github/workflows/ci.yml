name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qualification:
    name: Qualification (${{ matrix.os }}, Python ${{ matrix.python }}, Core ${{ matrix.current_core }}; historical ${{ matrix.core }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            current_core: "0.6.5"
            prior_core: "0.6.4"
            core: "0.6.3"
          - os: windows-latest
            python: "3.11"
            current_core: "0.6.5"
            prior_core: "0.6.4"
            core: "0.6.3"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure Core wheel paths
        shell: pwsh
        run: |
          $coreDirectory = Join-Path $env:RUNNER_TEMP "core"
          New-Item -ItemType Directory -Force -Path $coreDirectory | Out-Null
          $currentCoreWheel = Join-Path $coreDirectory "pds_core-${{ matrix.current_core }}-py3-none-any.whl"
          $priorCoreWheel = Join-Path $coreDirectory "pds_core-${{ matrix.prior_core }}-py3-none-any.whl"
          $historicalCoreWheel = Join-Path $coreDirectory "pds_core-${{ matrix.core }}-py3-none-any.whl"
          "PDS_CORE_WHEEL=$currentCoreWheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PDS_PRIOR_CORE_WHEEL=$priorCoreWheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PDS_HISTORICAL_CORE_WHEEL=$historicalCoreWheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download official Core release wheels
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v${{ matrix.current_core }}/pds_core-${{ matrix.current_core }}-py3-none-any.whl" `
            -OutFile $env:PDS_CORE_WHEEL `
            -ErrorAction Stop
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v${{ matrix.prior_core }}/pds_core-${{ matrix.prior_core }}-py3-none-any.whl" `
            -OutFile $env:PDS_PRIOR_CORE_WHEEL `
            -ErrorAction Stop
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v${{ matrix.core }}/pds_core-${{ matrix.core }}-py3-none-any.whl" `
            -OutFile $env:PDS_HISTORICAL_CORE_WHEEL `
            -ErrorAction Stop

      - name: Authenticate Core wheels and install current Core
        shell: pwsh
        run: |
          python scripts/verify_core_wheel.py "$env:PDS_CORE_WHEEL"
          python scripts/verify_core_wheel.py "$env:PDS_PRIOR_CORE_WHEEL"
          python scripts/verify_core_wheel.py "$env:PDS_HISTORICAL_CORE_WHEEL"
          python -m pip install "$env:PDS_CORE_WHEEL"

      - name: Install Portia development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete repository qualification
        shell: pwsh
        run: |
          python scripts/validate_repository.py `
            --core-wheel "$env:PDS_CORE_WHEEL" `
            --prior-core-wheel "$env:PDS_PRIOR_CORE_WHEEL" `
            --historical-core-wheel "$env:PDS_HISTORICAL_CORE_WHEEL"

  issue57-core066:
    name: "Issue #57 Core 0.6.6 installed (${{ matrix.os }}, Python 3.11)"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and authenticate official Core 0.6.6 wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = Join-Path $env:RUNNER_TEMP "pds_core-0.6.6-py3-none-any.whl"
          Invoke-WebRequest `
            -Uri "https://github.com/Paper-Data-Suite/pds-core/releases/download/v0.6.6/pds_core-0.6.6-py3-none-any.whl" `
            -OutFile $wheel -ErrorAction Stop
          python scripts/verify_core_wheel.py "$wheel"
          if ($LASTEXITCODE -ne 0) { throw "Core 0.6.6 authentication failed." }
          "PDS_CORE_WHEEL=$wheel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install official Core and Portia development dependencies
        shell: pwsh
        run: |
          python -m pip install "$env:PDS_CORE_WHEEL"
          if ($LASTEXITCODE -ne 0) { throw "Core 0.6.6 install failed." }
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Portia dev install failed." }
          python scripts/verify_core_wheel.py --installed 0.6.6
          if ($LASTEXITCODE -ne 0) { throw "Installed Core is not 0.6.6." }

      - name: Run Issue 57 focused capture tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_issue57_slice1_contracts.py `
            tests/test_issue57_slice2_batches.py `
            tests/test_issue57_slice3_page_targets.py `
            tests/test_issue57_slice4_purposes.py `
            tests/test_issue57_slice5_routes.py `
            tests/test_issue57_slice6_preparation.py `
            tests/test_issue57_slice7_recovery.py `
            tests/test_issue57_slice8_core066.py
          if ($LASTEXITCODE -ne 0) { throw "Issue 57 focused tests failed." }

      - name: Build and test installed Portia wheel against official Core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wheels = Join-Path $env:RUNNER_TEMP "portia-wheel"
          New-Item -ItemType Directory -Force -Path $wheels | Out-Null
          python -m build --wheel --outdir "$wheels"
          if ($LASTEXITCODE -ne 0) { throw "Portia wheel build failed." }
          $wheel = Join-Path $wheels "pds_portia-0.2.0-py3-none-any.whl"
          if (-not (Test-Path -LiteralPath $wheel -PathType Leaf)) {
            throw "Expected Portia development wheel not produced."
          }
          python scripts/smoke_test_issue57_core066_wheel.py `
            "$wheel" "$env:PDS_CORE_WHEEL" `
            --fixtures tests/fixtures
          if ($LASTEXITCODE -ne 0) {
            throw "Issue 57 Core 0.6.6 installed-wheel acceptance failed."
          }
